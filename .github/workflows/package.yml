name: Build & package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Target runtime identifier (RID)"
        default: linux-x64
      self_contained:
        description: "Bundle the .NET runtime in the zip"
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  RUNTIME: ${{ inputs.runtime || 'linux-x64' }}
  SELF_CONTAINED: ${{ inputs.self_contained == false && 'false' || 'true' }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TurfGuess.slnx

      - name: Build
        run: dotnet build TurfGuess.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TurfGuess.slnx -c Release --no-build

      - name: Publish bot
        run: >
          dotnet publish src/TurfGuess.Bot/TurfGuess.Bot.csproj
          -c Release -r "$RUNTIME" --self-contained "$SELF_CONTAINED"
          -p:DebugType=None -p:DebugSymbols=false
          -o publish

      - name: Zip
        id: zip
        run: |
          sudo apt-get install -y -qq zip >/dev/null
          VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          NAME="TurfGuess-${VERSION}-${RUNTIME}.zip"
          (cd publish && zip -qr "../$NAME" .)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          unzip -l "$NAME" | tail -n 5

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}
          if-no-files-found: error
          retention-days: 30
