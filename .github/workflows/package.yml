name: Build & package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Target runtime identifier (RID)"
        default: linux-x64
      self_contained:
        description: "Bundle the .NET runtime in the zip"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  RUNTIME: ${{ inputs.runtime || 'linux-x64' }}
  SELF_CONTAINED: ${{ github.event_name == 'workflow_dispatch' && !inputs.self_contained && 'false' || 'true' }}

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the release step on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TurfGuess.slnx

      - name: Build
        run: dotnet build TurfGuess.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TurfGuess.slnx -c Release --no-build

      - name: Publish bot
        run: >
          dotnet publish src/TurfGuess.Bot/TurfGuess.Bot.csproj
          -c Release -r "$RUNTIME" --self-contained "$SELF_CONTAINED"
          -p:DebugType=None -p:DebugSymbols=false
          -o publish

      - name: Name & zip
        id: zip
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          elif [[ -n "$PR_NUMBER" ]]; then
            VERSION="pr-${PR_NUMBER}-${PR_SHA::7}"
          else
            VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          fi
          NAME="TurfGuess-${VERSION}-${RUNTIME}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            (cd publish && zip -qr "../$NAME.zip" .)
            unzip -l "$NAME.zip" | tail -n 5
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: publish
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.name }}.zip" --generate-notes
